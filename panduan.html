                <span class="navbar-toggler-icon"></span>

    <!-- Main Content -->
    <section class="py-4 bg-light flex-grow-1 d-flex flex-column">
        <div class="container flex-grow-1 d-flex flex-column">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden flex-grow-1">
                <div class="card-body p-3 p-md-4 bg-light d-flex flex-column align-items-center" style="overflow-y: auto;">
                    <div id="pdf-container" class="w-100 text-center" style="max-width: 900px;">

    <!-- Bootstrap JS -->

    <!-- PDF.js Implementation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const url = 'panduan.pdf';
        const container = document.getElementById('pdf-container');
        const loading = document.getElementById('pdf-loading');

        pdfjsLib.getDocument(url).promise.then(pdf => {
            loading.style.display = 'none';
            
            // Create placeholders to maintain correct page order
            for (let i = 1; i <= pdf.numPages; i++) {
                const wrapper = document.createElement('div');
                wrapper.id = `page-wrapper-${i}`;
                wrapper.className = 'mb-3 w-100 text-center';
                container.appendChild(wrapper);
            }

            // Render pages
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                pdf.getPage(pageNum).then(page => {
                    const viewport = page.getViewport({ scale: 1.5 });
                    
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    
                    // Responsive styling
                    canvas.style.width = '100%';
                    canvas.style.height = 'auto';
                    canvas.className = 'shadow-sm rounded bg-white';
                    
                    const renderContext = {
                        canvasContext: ctx,
                        viewport: viewport
                    };
                    
                    page.render(renderContext);
                    document.getElementById(`page-wrapper-${pageNum}`).appendChild(canvas);
                });
            }
        }).catch(err => {
            loading.innerHTML = '<p class="text-danger fw-bold">Gagal memuat PDF. Silakan coba lagi nanti.</p>';
            console.error(err);
        });
    </script>
</body>
